services:
  app:
    image: ghcr.io/firesh0ot/dms-only-friend:${DMS_IMAGE_TAG:-latest}
    build: .
    container_name: dms-only-friend
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3001}
    volumes:
      - dms-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dms-data:
