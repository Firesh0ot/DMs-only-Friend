services:
  app:
    image: ghcr.io/firesh0ot/dms-only-friend:${DMS_IMAGE_TAG:-latest}
    build: .
    container_name: dms-only-friend
    ports:
      - "${PORT:-8042}:3001"
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8042}
    volumes:
      - dms-data:/data
    restart: unless-stopped
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-false}"
      - "traefik.http.routers.dms.rule=Host(`${FQDN:-localhost}`)"
      - "traefik.http.routers.dms.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.dms.tls=${TRAEFIK_TLS:-true}"
      - "traefik.http.services.dms.loadbalancer.server.port=3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dms-data:
